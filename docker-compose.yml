services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nicu}
      POSTGRES_DB: ${POSTGRES_DB:-nicu}
      POSTGRES_USER: ${POSTGRES_USER:-nicu}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nicu} -d ${POSTGRES_DB:-nicu}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build: api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    volumes: ["./library:/app/library"]

  ui:
    build: ui
    env_file: .env
    depends_on: [api]
    ports: ["${STREAMLIT_PORT:-8501}:8501"]
    environment:
      - API_URL=http://api:8000
    volumes: ["./library:/app/library"]

volumes:
  dbdata:
