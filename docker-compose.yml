services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      NICU_OFFLINE: "1"
    ports: ["127.0.0.1:8000:8000"]
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on: [api]
    ports: ["127.0.0.1:${STREAMLIT_PORT:-8501}:8501"]
    environment:
      API_URL: http://api:8000
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
  # Retained for future independent review of the legacy evidence pipeline.
  db:
    profiles: [evidence]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nicu}
      POSTGRES_DB: ${POSTGRES_DB:-nicu}
      POSTGRES_USER: ${POSTGRES_USER:-nicu}
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nicu} -d ${POSTGRES_DB:-nicu}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["dbdata:/var/lib/postgresql/data"]
volumes:
  dbdata:
